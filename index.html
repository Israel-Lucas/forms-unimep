<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LISTA DE PRESENÇA JÚRI SIMULADO</title>
    <link rel="icon" href="./assets/favicon.ico?v=3" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="./assets/favicon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="site-header">
        <p>JURI SIMULADO</p>
      </header>
      <section class="form-area">
        <header class="hero">
          <h1>LISTA DE PRESENÇA<br />JÚRI SIMULADO</h1>
          <div class="ornament"><span></span></div>
          <p class="subtitle">Registro de presença</p>
        </header>

        <form id="registration-form" method="POST" novalidate>
          <div class="field field-full">
            <label for="nome">Nome completo</label>
            <input id="nome" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field field-full">
            <label for="semestre">Semestre</label>
            <select id="semestre" name="semestre" required>
              <option value="" selected disabled>Selecione</option>
              <option>1º semestre</option>
              <option>2º semestre</option>
              <option>3º semestre</option>
              <option>4º semestre</option>
              <option>5º semestre</option>
              <option>6º semestre</option>
              <option>7º semestre</option>
              <option>8º semestre</option>
              <option>9º semestre</option>
              <option>10º semestre</option>
            </select>
          </div>
          <button type="submit">Enviar inscrição</button>
          <p class="status" id="status" aria-live="polite"></p>
          <p class="notice">Ao enviar, seus dados serão encaminhados para a organização.</p>
        </form>
      </section>
      <footer>
        <div class="footer-line"></div>
        <img src="./assets/unimep_logo.png" alt="UNIMEP — Universidade Metodista de Piracicaba" />
      </footer>
    </main>
    <div class="modal" id="success-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <span class="checkmark" aria-hidden="true">✓</span>
        <h2 id="modal-title">Inscrição concluída!</h2>
        <p>Recebemos seus dados. Em breve, a organização entrará em contato caso seja necessário.</p>
        <button class="modal-button" id="close-modal" type="button">Entendi</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
